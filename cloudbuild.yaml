steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/obs-mcp/obs-mcp:$_COMMIT_SHA', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/obs-mcp/obs-mcp:latest', '.']

  # Push the container images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/obs-mcp/obs-mcp:$_COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/obs-mcp/obs-mcp:latest']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        VPC_ARGS=""
        if [ -n "$_VPC_CONNECTOR" ]; then
          VPC_ARGS="--vpc-connector=$_VPC_CONNECTOR --ingress=internal-and-cloud-load-balancing"
        fi
        gcloud run deploy obs-mcp \
          --image us-central1-docker.pkg.dev/$PROJECT_ID/obs-mcp/obs-mcp:$_COMMIT_SHA \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars MCP_TRANSPORT=sse \
          $VPC_ARGS

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/obs-mcp/obs-mcp:$_COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/obs-mcp/obs-mcp:latest'

substitutions:
  _COMMIT_SHA: 'latest'
  _VPC_CONNECTOR: ''
