steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/obs-mcp:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/obs-mcp:latest', '.']

  # Push the container images to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/obs-mcp:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/obs-mcp:latest']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'obs-mcp'
      - '--image'
      - 'gcr.io/$PROJECT_ID/obs-mcp:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'MCP_TRANSPORT=sse'

images:
  - 'gcr.io/$PROJECT_ID/obs-mcp:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/obs-mcp:latest'
