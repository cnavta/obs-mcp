# MCP SDK 2.0 Migration - Prioritized Backlog
# Sprint: sprint-12-twql41
# Role: Lead Implementor
# Date: 2026-08-30

metadata:
  sprint_id: sprint-12-twql41
  project: obs-mcp
  migration: "MCP SDK v1.0 → v2.0"
  total_estimated_hours: 24
  status: planning
  created: 2026-08-30
  owner: Lead Implementor

# Task Status Values:
# - not_started: Task not yet begun
# - in_progress: Task currently being worked on
# - blocked: Task blocked by dependency or issue
# - completed: Task finished and validated
# - skipped: Task skipped (with reason)

# Priority Levels:
# - P0: Critical path, must complete
# - P1: High priority, should complete
# - P2: Medium priority, nice to have
# - P3: Low priority, optional

phases:

  # ============================================================================
  # PHASE 0: PRE-MIGRATION SETUP (COMPLETED)
  # ============================================================================

  - phase: 0
    name: "Pre-Migration Setup"
    status: completed
    duration_hours: 4
    tasks: []  # All completed before backlog creation

  # ============================================================================
  # PHASE 1: AUTOMATED MIGRATION
  # ============================================================================

  - phase: 1
    name: "Automated Migration"
    status: not_started
    duration_hours: 2.5
    tasks:

      - id: P0-001
        title: "Run codemod transformation"
        description: |
          Execute the official MCP codemod to automatically transform v1 code to v2.
          Command: npx @modelcontextprotocol/codemod@latest v1-to-v2 .
        priority: P0
        status: not_started
        estimated_hours: 0.5
        dependencies: []
        acceptance_criteria:
          - Codemod executes without fatal errors
          - Transformation summary displayed
          - Files modified (imports, handler signatures, etc.)
          - No package.json corruption
        commands:
          - "npx @modelcontextprotocol/codemod@latest v1-to-v2 ."
        validation:
          - "Check codemod output for success message"
          - "Verify git diff shows expected changes"

      - id: P0-002
        title: "Review codemod output and error markers"
        description: |
          Search for @mcp-codemod-error markers that indicate manual fixup required.
          Catalog all markers and understand what needs manual intervention.
        priority: P0
        status: not_started
        estimated_hours: 0.5
        dependencies: [P0-001]
        acceptance_criteria:
          - All @mcp-codemod-error markers found and cataloged
          - Error locations documented
          - Reason for each error understood
        commands:
          - "grep -rn '@mcp-codemod-error' src/"
        validation:
          - "Document all error markers in spreadsheet or notes"
          - "Categorize errors by type"

      - id: P0-003
        title: "Analyze codemod transformation quality"
        description: |
          Review the codemod changes to understand what was transformed.
          Verify import updates, handler signature changes, schema wrapping.
        priority: P0
        status: not_started
        estimated_hours: 1.0
        dependencies: [P0-002]
        acceptance_criteria:
          - Import transformations reviewed
          - Handler signature changes reviewed
          - Schema transformations reviewed
          - Quality assessment documented
        validation:
          - "Review git diff for each modified file"
          - "Spot-check 3-5 tool files for correct transformation"

      - id: P0-004
        title: "Document manual fixup requirements"
        description: |
          Create a list of manual changes needed beyond codemod automation.
          Include transport migration, server factory pattern, error handling.
        priority: P0
        status: not_started
        estimated_hours: 0.5
        dependencies: [P0-003]
        acceptance_criteria:
          - Manual fixup list created
          - Each item prioritized
          - Estimated effort for each item
          - List shared with team
        deliverable: "manual-fixup-list.md"
        validation:
          - "Compare list against architecture document"

  # ============================================================================
  # PHASE 2: DEPENDENCY MANAGEMENT
  # ============================================================================

  - phase: 2
    name: "Dependency Management"
    status: not_started
    duration_hours: 1.5
    tasks:

      - id: P0-005
