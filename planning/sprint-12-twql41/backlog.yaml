        description: |
          Add MCP SDK v2 packages while keeping v1 for staged migration.
          Add: @modelcontextprotocol/server, /node, /express
          Keep: @modelcontextprotocol/sdk (for now)
        priority: P0
        status: not_started
        estimated_hours: 0.25
        dependencies: [P0-004]
        acceptance_criteria:
          - "@modelcontextprotocol/server": "^2.0.0" added
          - "@modelcontextprotocol/node": "^2.0.0" added
          - "@modelcontextprotocol/express": "^2.0.0" added
          - v1 SDK (@modelcontextprotocol/sdk) still present
        files_modified:
          - package.json
        validation:
          - "Verify package.json has both v1 and v2 dependencies"

      - id: P0-006
        title: "Update Zod version to ^4.2.0"
        description: |
          Update zod dependency from ^3.22.4 to ^4.2.0 as required by v2 SDK.
        priority: P0
        status: not_started
        estimated_hours: 0.25
        dependencies: [P0-005]
        acceptance_criteria:
          - "zod": "^4.2.0" in package.json
          - No other zod version in dependencies
        files_modified:
          - package.json
        validation:
          - "Check package.json for correct zod version"

      - id: P0-007
        title: "Run npm install and verify resolution"
        description: |
          Install all dependencies and verify no conflicts.
          Check for peer dependency warnings.
        priority: P0
        status: not_started
        estimated_hours: 0.25
        dependencies: [P0-006]
        acceptance_criteria:
          - npm install completes successfully
          - No dependency resolution errors
          - node_modules populated correctly
        commands:
          - "npm install"
        validation:
          - "Check for error messages in install output"
          - "Verify no peer dependency errors"

      - id: P0-008
        title: "Verify no peer dependency conflicts"
        description: |
          Review npm output for peer dependency warnings.
          Resolve any conflicts between v1 and v2 packages.
        priority: P0
        status: not_started
        estimated_hours: 0.25
        dependencies: [P0-007]
        acceptance_criteria:
          - No peer dependency errors
          - All warnings reviewed and documented
          - Conflicts resolved if any
        validation:
