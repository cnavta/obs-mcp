          - No duplicate WebSocket connections
          - Connection state consistent
        files_modified:
          - src/server.ts
        validation:
          - "Verify obsClient created once at module level"
          - "Test multiple buildServer() calls share client"

      - id: P1-004
        title: "Update server initialization logic"
